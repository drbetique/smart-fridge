; =============================================================================
; Smart Fridge — Camera Controller
; Board  : AI Thinker ESP32-CAM
; Author : Victor Betiku (github.com/drbetique)
; =============================================================================
[env:esp32cam]
platform              = espressif32
board                 = esp32cam
framework             = arduino

monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder

upload_speed          = 460800

; WiFiClientSecure and HTTPClient are bundled with the ESP32 Arduino framework
lib_deps =
    https://github.com/thinger-io/Arduino-Library.git
